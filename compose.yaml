services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quanyejun
      POSTGRES_USER: quanyejun
      POSTGRES_PASSWORD: quanyejun
    ports:
      - "5432:5432"
    volumes:
      - quanyejun-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanyejun -d quanyejun"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://quanyejun:quanyejun@postgres:5432/quanyejun?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      IDENTITY_DISPLAY_NAME: ${IDENTITY_DISPLAY_NAME:-QuanYejun}
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:-http://localhost:8080/auth/callback}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-builtin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_STORE: ${OPENAI_STORE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      QUANYEJUN_ENVIRONMENT_ALLOW: read-files,write-files
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - quanyejun-runtime:/var/lib/quanyejun
      - quanyejun-cache:/var/cache/quanyejun
      - quanyejun-config:/etc/quanyejun
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_RUNTIME_URL: ${NEXT_PUBLIC_RUNTIME_URL:-}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      runtime:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  quanyejun-postgres:
  quanyejun-runtime:
  quanyejun-cache:
  quanyejun-config:
