# Frontend checks only; no backend services or deployment credentials.
when:
  - event: [push, pull_request, manual]

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      # Shared design assets are vendored; the private reference is not a build input.
      recursive: false

steps:
  - name: frontend-checks
    image: node:22-bookworm-slim
    environment:
      CI: "true"
      NEXT_PUBLIC_RUNTIME_URL: ""
    commands:
      - corepack enable
      - corepack prepare pnpm@11.19.0 --activate
      - cd frontend
      - pnpm install --frozen-lockfile
      - pnpm lint
      - pnpm typecheck
      # pnpm test builds the frontend before running the Node tests.
      - pnpm test
